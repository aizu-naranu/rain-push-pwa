<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>傘いるよ通知</title>
<link rel="manifest" href="./manifest.webmanifest" />
<meta name="theme-color" content="#1b6ca8" />
<link rel="apple-touch-icon" href="./icons/icon-192.png" />
<style>
  :root { color-scheme: light dark; }
  body {
    font-family: system-ui, -apple-system, "Hiragino Sans", sans-serif;
    margin: 0; padding: 24px 20px 48px; line-height: 1.7;
    max-width: 560px; margin-inline: auto;
  }
  h1 { font-size: 1.4rem; margin: 0 0 4px; }
  .sub { color: #777; font-size: .85rem; margin: 0 0 24px; }
  button {
    font: inherit; padding: 14px 20px; border-radius: 12px; border: 0;
    background: #1b6ca8; color: #fff; width: 100%; margin-bottom: 12px;
  }
  button[disabled] { opacity: .45; }
  button.ghost { background: transparent; color: #1b6ca8; border: 1px solid #1b6ca8; }
  #log {
    white-space: pre-wrap; word-break: break-all; font-family: ui-monospace, monospace;
    font-size: .75rem; background: #0001; padding: 12px; border-radius: 10px; min-height: 4em;
  }
  textarea {
    width: 100%; min-height: 160px; font-family: ui-monospace, monospace;
    font-size: .7rem; border-radius: 10px; padding: 10px; box-sizing: border-box;
  }
  details { margin-top: 24px; font-size: .85rem; }
</style>
</head>
<body>
<h1>☔ 傘いるよ通知</h1>
<p class="sub">朝7時に今日の降水確率をチェックして、雨なら通知します。</p>

<button id="enable">通知を有効にする</button>
<button id="test" class="ghost" disabled>テスト通知（ローカル）</button>

<div id="log">読み込み中…</div>

<details id="subBox" hidden>
  <summary>購読情報（サーバー登録用 JSON）</summary>
  <p>これをコピーして <code>subscriptions.json</code> に追記 → push すると、朝7時の配信対象になります。</p>
  <textarea id="sub" readonly></textarea>
  <button id="copy" class="ghost">コピー</button>
</details>

<details>
  <summary>iOS で使うには</summary>
  <p>Safari で開く → 共有 → <b>ホーム画面に追加</b> → そのアイコンから起動。
  iOS は PWA としてインストールしないと Web Push を受け取れません（iOS 16.4 以降）。</p>
</details>

<script src="./config.js"></script>
<script src="./app.js"></script>
</body>
</html>
